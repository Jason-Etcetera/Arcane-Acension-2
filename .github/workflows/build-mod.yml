
name: Build Arcane Ascension

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Minecraft mod
        working-directory: ArcaneAscension-GitHub-Upload-Part-1
        run: gradle --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneAscension-v0.2.0
          path: ArcaneAscension-GitHub-Upload-Part-1/build/libs/*.jar
          if-no-files-found: error
